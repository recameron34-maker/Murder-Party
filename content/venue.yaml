    shape: [[711, 141], [932, 141], [932, 343], [711, 343]]
  - id: landing
    name: Landing
    note: The top of the front stairs, inside the railings.
    game: library
    shape: [[778, 345], [903, 345], [925, 403], [778, 403]]
  - id: front-stairs
    name: Front stairs
    outside: true
    note: Up from the street.
    shape: [[778, 405], [928, 405], [928, 487], [778, 487]]
