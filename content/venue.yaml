  - [82, 298, 128, 298]     # balcony ↔ back hall
  - [141, 305, 141, 340]    # back hall ↔ laundry
  - [217, 320, 217, 450]    # laundry ↔ kitchen
  - [414, 280, 414, 356]    # kitchen ↔ hall (open)
  - [515, 290, 515, 336]    # hall ↔ dining area
  - [513, 150, 513, 190]    # dining area ↔ bedroom (the Conservatory tonight)
  - [708, 178, 708, 278]    # dining area ↔ living room
  - [932, 168, 932, 318]    # living room ↔ family room
  - [1030, 343, 1092, 343]  # family room ↔ the Room
  - [460, 358, 498, 358]    # hall ↔ bathroom
  - [812, 343, 850, 343]    # the front door: landing ↔ living room
  - [800, 404, 890, 404]    # the front stairs come up onto the landing

# Closed doors into shut rooms. Not drawn as openings; the case map's
# replay walks story moves through them (Louis to the East Wing, Shea
# "upstairs").
doors:
  - [230, 277, 272, 277]    # kitchen ↔ small bedroom
  - [648, 343, 688, 343]    # dining area ↔ primary bedroom

# `dir` is the way you walk in: up the front stairs, across the landing,
# and through the front door (an opening above) into the Living Room.
entrances:
  - { label: "Stairs up", at: [855, 487], dir: [0, -1] }

