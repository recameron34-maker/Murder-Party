# Ross's flat as Blackwood Manor: "the house tonight".
#
# GUEST-SAFE. Every guest page draws this plan (Manor tab) so people can find
# the study, the library and the rest on the night. Never put hiding spots,
# the passage or anyone's whereabouts here. Hiding spots live in
# content/clues/*.yaml; host-only setup notes live in lore.yaml (venue_setup).
# The host case map (Map page) draws the story on this same plan.
#
# Coordinates trace Ross's floor plan (image pixels, about 1206 × 647).
#   game        the manor room this real room plays (room id from lore.yaml)
#   shut        off-limits tonight ("the East Wing stays dark"); never a game area
#   story       a shut room's part in the story (case map only; nobody goes in)
#   aka         how guest pages name the room ("Tonight: the …")
#   game_where  optional: where in the room, for "Tonight: …" on guest pages
#   label_at    optional: where the room's label sits (default: the middle)
#   label       false to leave a room unlabelled
#   pins_at     optional: where the host map starts its row of evidence pins
#   spots       manor rooms that are just a corner of a real room
#   stage       where each manor room's people stand on the case map replay,
#               as [x, y, width, height]
#
# Why this layout: the study (the Side Room, labelled "Room" on the floor
# plan) is the dead end of the flat, through the Family Room, which plays the
# East Corridor. The library is the landing at the top of the front stairs.
# The way between them runs through the Living Room (the Drawing Room) and the
# front door (the Library Corridor). From 9:25 the party is round the birthday
# cake in the Dining Area, so the Living Room is nearly empty.
# Ross: any bedroom may be unlocked. The bedroom off the Dining Area plays the
# Conservatory, so Carlotta waits out of sight of the study door.

name: "Ross's flat"
viewbox: [14, 76, 1180, 492]

areas:
  - id: balcony
    name: Balcony
    size: "7'0\" × 9'10\""
    game: terrace
    outside: true
    shape: [[26, 141], [138, 141], [138, 298], [26, 298]]
  - id: back-hall
