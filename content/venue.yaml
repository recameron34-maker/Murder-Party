    shape: [[415, 358], [501, 358], [501, 485], [415, 485]]
  - id: closet-mid
    name: Closet
    shut: true
    shape: [[502, 345], [576, 345], [576, 485], [502, 485]]
  - id: dining-area
    name: Dining Area
    size: "13'10\" × 15'10\""
    game: dining-room
    label_at: [650, 170]
    shape: [[515, 141], [560, 90], [660, 90], [708, 141], [708, 343], [515, 343]]
  - id: primary-bedroom
