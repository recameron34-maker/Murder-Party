# Party-wide settings.
title: Murder at Blackwood Manor
host_name: Ross
host_character: Reginald "Reggie" Blackwood
# Party date (YYYY-MM-DD) and IANA time zone. Pre-party teaser texts
# ({ day: -1, time: "18:00" }) are scheduled relative to this. Leave null
# until the date is fixed; dated texts simply won't fire.
date: null
timezone: America/Chicago

# Phones at the party? Ross (October 2026): no. Guests read their pages
# BEFORE the party (character, story, messages so far); on the night
# everything is paper. With phones: false, guest pages never open a round,
# in-party messages are printed inside the envelopes, and the texts to
# everyone appear on the host dashboard to read aloud. Set true to bring
# the phone companion back.
phones: false

# Suggested clock times, anchored to food the way most hosted mystery games
# are (starters, main, dessert). `round` links each phase to the live round
# so the dashboard can show where you are. Move the times; keep the order.
schedule:
  - { time: "7:30 PM", what: "Doors. Arrivals as Arthur, drinks, the guest book", food: "Champagne and canapés", round: 0 }
  - { time: "7:50 PM", what: "Birthday toast and formal opening (Arthur)", food: "", round: 0 }
  - { time: "8:00 PM", what: "Mingle in character", food: "Canapés keep coming", round: 0 }
  - { time: "8:15 PM", what: "The birthday cake; Arthur retires to his study (change in the closet)", food: "Birthday cake", round: 0 }
  - { time: "8:30 PM", what: "The blackout. \"My brother has been murdered.\"", food: "", round: 0 }
  - { time: "8:40 PM", what: "Rules, Blackmail Cash, Round One envelopes", food: "Starters / grazing board", round: 1 }
  - { time: "9:25 PM", what: "Round Two envelopes", food: "Main course", round: 2 }
  - { time: "10:15 PM", what: "Round Three envelopes", food: "Dessert", round: 3 }
  - { time: "10:55 PM", what: "Accusations", food: "Coffee and the Reckoning (a Sazerac)", round: 3 }
  - { time: "11:10 PM", what: "The reveal and the hidden door", food: "", round: 3 }
  - { time: "11:50 PM", what: "Awards, the midnight photograph, the guest book", food: "Midnight snacks", round: 3 }

# Awards, read out after the reveal (the run of show has the patter).
# Print → Award certificates prints one each with a line for the winner.
awards:
  - { title: "Best Detective", for: "Named the murderer, the motive and the way out of the study." }
  - { title: "Best Performance", for: "Never once broke character. Possibly never will." }
  - { title: "Best Dressed", for: "Dressed for a reckoning, and won it." }
  - { title: "Most Suspicious Innocent Person", for: "The most votes of anyone who didn't do it." }
  - { title: "Most Unhinged Theory", for: "Wrong in ways that will be discussed for years." }
  - { title: "Best Liar", for: "Lied beautifully, and possibly still is." }
  - { title: "Richest Blackmailer", for: "Ended the night with the most Blackwood Blackmail Notes." }

# Real-life couples (Ross, October 2026). Their characters may only be
# romantic with each other, and no line anywhere may hint that either would
# stray or take a dig at their partner. The checker flags romance words that
# link a coupled character to anyone else. Single players are fair game.
couples:
  - [noor, joji]
  - [lindsey, malik]
  - [maya, kevin]
