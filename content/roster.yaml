# Casting. Who plays whom.
#
# status:
#   confirmed         cast and coming
#   maybe             assigned to a guest who hasn't confirmed (can log in; their
#                     [[if:...]] lines in other people's envelopes stay OFF until confirmed)
#   declined          a maybe who isn't coming (fallbacks apply)
#   spare-unassigned  a spare nobody is playing (no login, fallbacks apply)
#   spare-assigned    a spare handed to a late guest
#
# Passphrases are NOT stored here (the repo may be public). The host panel
# generates them and keeps them server-side. Changes made in the host panel
# at the party override this file.

cast:
