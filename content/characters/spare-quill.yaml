id: spare-quill
name: Quill
written_for: Spare, any late guest   # HOST
tier: flex                      # HOST
effort: low                     # HOST
pronouns: any                   # HOST
role: Portrait painter
public_role: "Portrait painter"   # what everyone at the party knows; shown on every guest's guest list
tagline: "You paint the rich as they wish to be seen. It's the most lucrative lie in England."

costume: |
  Bohemian: paint-flecked shirt or smock under an evening jacket, a beret
  or silk scarf, a sketchbook and charcoal. You're "[Name] Quill" or simply
  Quill.

intro: |
  Douglas commissioned you to restore an old portrait of **Nana Rose**, the
  castle's cook for forty years, as a birthday gift for Maya. It's finished,
  hidden under a sheet in the conservatory. Now there's no one to give it to
  her.

backstory: |
  You've painted three Camerons, two of their mistresses and one horse.
  Your secret commission is the scandalous one. Last year Douglas paid you to
  paint **Clara**, "in the classical style," wearing very little except
  pearls. It hangs behind a velvet curtain in his study. Nobody else has
  seen it. You'd rather keep it that way. So would Clara.

relationships:
  - with: maya
    text: Douglas's birthday gift for her, her grandmother's portrait, is your work. You want her to have it.
  - with: clara
    text: You painted her for Douglas's private study. Classical style. Pearls.
  - with: molly
    text: The art dealer. She once tried to sell one of your paintings as "school of Sargent." You haven't forgotten.

evening:
  - at: "8:00 PM"
    until: "9:05 PM"
    where: conservatory
    text: Checking the varnish on Nana Rose's portrait under its sheet.
  - at: "9:10 PM"
    until: "9:45 PM"
    where: billiard-room
    text: Sketching Jimmy Friedman's card game. Smoke, green baize, bad decisions.

knows:
  - Douglas's surprise for Maya was a restored portrait of her grandmother.
  - There's a portrait of Clara behind a curtain in Douglas's study.
  - You were sketching in the billiard room from 9:10 to the blackout.

secret: |
  You painted a **very private portrait of Clara** for Douglas's study, and
  you know Douglas's birthday gift to Maya.

blackmail:
  - Douglas had you restore Nana Rose's portrait for Maya.
  - You painted Clara, scandalously, for Douglas.
  - The portrait of Clara hangs behind a curtain in the study.

instructions:
  - Low effort. Sketch people. Hand them the sketch. Watch their faces.
  - You may sell the secret of the Clara portrait for Blackmail Cash.
  - Comfort Maya at some point. It's what Douglas would have wanted.
  - Your alibi: sketching the card game from 9:10.

mission: |
  Do a **60-second sketch of three different guests** (stick figures are
  fine) and get each to sign it. Show Roderick.

rounds:
  1:
    text: |
      Tell Maya, privately or publicly, that Douglas had a birthday gift for
      her: her grandmother's portrait, which you restored.
    reveal:
      - Douglas's birthday gift for Maya was a restored portrait of Nana Rose.
  2:
    text: |
      If people are speculating about Clara and Douglas, smile mysteriously.
      You know more than they do. You've *painted* more than they know.
    reveal:
      - Hint that Clara and Douglas were closer than people think.
  3:
    text: |
      If paid, reveal the portrait of Clara behind the study curtain. Or
      keep it as your gift to Clara. Your choice.
    reveal:
      - Reveal, or protect, the private portrait of Clara.

texts:
  - id: quill-douglas-history
    from: Douglas Cameron
    trigger: { history: true }
    stamp: "Yesterday"
    body: "Rose to the conservatory, under a sheet. I'll walk Maya in myself after the toast. She'll cry. So will I, probably."

fallback: |
  Nothing depends on Quill. Maya's own Round Three envelope already reveals
  the portrait gift.

host_notes: |
  Spare, low effort, any gender or name. Flavor and scandal; corroborates
  Maya's gift. Whereabouts: conservatory, then billiard room.
