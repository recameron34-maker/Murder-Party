id: kevin
name: Kevin Cameron
written_for: Kevin              # HOST
tier: supporting                # HOST
pronouns: he/him                # HOST
role: Douglas's nephew, the heir who wasn't
public_role: "Douglas's nephew (and, technically, Roderick's)"   # what everyone at the party knows; shown on every guest's guest list
tagline: "You're the Cameron who stayed. Apparently that counts for nothing."

costume: |
  Country-house heir: a dinner jacket worn with aggressive confidence, family
  cufflinks (one is missing; you'll find out why), slicked hair, a signet
  ring, and the air of a man who has never once paid for his own drink.

intro: |
  You're Douglas's nephew (and, absurdly, Roderick's: he's Douglas's little
  brother and barely older than you), and for fifteen years you've
  been the dutiful Cameron: shooting weekends, board seats, sucking up.
  Everyone, you especially, assumed you'd inherit the castle. At 9:20 tonight
  Douglas told you: **"You're getting nothing."**

backstory: |
  You live, if you're honest, on Douglas's allowance. The flat, the car, the
  club, all Douglas. "You're getting nothing" didn't only mean the house. It
  meant the allowance stops at midnight.

  You shouted. Half the East Corridor heard you say **"You're going to regret
  this."** You meant he'd regret tearing the family apart. It sounds like a
  murder threat. You know it does.

  Then you grabbed the nearest coat off the hall hook (Douglas's, as it turns
  out) and stormed onto the terrace to smoke and rage at the rain. You
  were out there until the lights came back.

  And there's **Maya Rose**, the cook's granddaughter. The summer you were
  fourteen she showed you where the kitchen hid the good biscuits and you
  taught her to swim in the black lake below the house. Last spring you
  found each other again, and you've been together since, secretly: your
  late father would have called her "the help", and you never dared ask
  Douglas. You went to the study at 9:20 to finally tell him. He didn't let
  you get that far. There's a ring in your jacket, bought with the last of
  his allowance. You were going to say it at midnight anyway.

relationships:
  - with: douglas
    text: Your uncle. You performed devotion for fifteen years and got "you're getting nothing" for your trouble.
  - with: maya
    text: The love of your life, and the one secret in this house that's yours. Tonight you were going to say it out loud.
  - with: morgan
    text: Douglas's lawyer, who has handled your allowance for years. Always kind, always quick with a pen. You'd defend her to anyone.
  - with: roderick
    text: Your uncle, technically, though he's barely older than you. You spent the afternoon helping him move furniture into the study. He owes you.
  - with: carlotta
    text: Your cousin, the real heir, who walked away from everything you wanted. You resent her with your whole chest.
  - with: jimmy
    text: The ward. He keeps telling people you had the bigger motive. You'd like to throw him in the lake.

evening:
  - at: "3:00 PM"
    where: study
    text: Helping Roderick haul furniture into the study for the Supper. Hot, heavy work; you rolled your sleeves up.
  - at: "8:00 PM"
    until: "9:19 PM"
    where: drawing-room
    text: Holding court as the heir apparent.
  - at: "9:20 PM"
    until: "9:21 PM"
    where: study
    text: 'Douglas says: **"You''re getting nothing."** You shout: **"You''re going to regret this."** The door is open. People hear.'
  - at: "9:22 PM"
    until: "9:47 PM"
    where: terrace
    text: You grab a coat (Douglas's, you realize later) and storm onto the terrace. Pacing, smoking, raging at the rain. You come in when the lights return.

knows:
  - Douglas told you at 9:20 you were getting nothing. The allowance stops at midnight.
  - You were on the terrace from 9:22 until after the blackout.
  - There's a security camera on the terrace. You forgot until just now.
  - You're wearing Douglas's coat. You haven't checked the pockets.

secret: |
  You **threatened Douglas at 9:20** and you live entirely on his money, which
  stops at midnight. But you were on the terrace, on camera, during the
  murder. And you've been secretly with Maya Rose for a year.

blackmail:
  - You said "You're going to regret this" to Douglas.
  - You live on an allowance from Douglas, which ends tonight.
  - You and Maya Rose are secretly together, and there's a ring in your pocket.

instructions:
  - In Round One you **must admit you said "You're going to regret this."** Insist you meant the family, not murder.
  - When a cufflink is found, **recognize it as yours** and panic. You don't know when you lost it.
  - Defend Morgan if people accuse her. You can't help yourself.
  - If anyone points at Maya, defend her, loudly. Explaining why is optional.
  - In Round Three, the coat will matter. Follow your envelope.

mission: |
  Get someone to **believe your argument with Douglas wasn't about money.**
  (It was.) Report the believer to Roderick.

rounds:
  1:
    text: |
      People heard you at 9:20. Admit it before they do: **you told Douglas,
      "You're going to regret this."** You meant he'd regret destroying the
      family. Of course you did.

      A cufflink may turn up near the study. **It's yours.** Recognize it out
      loud and go pale. You have no idea when you lost it.
    reveal:
      - 'You told Douglas "You''re going to regret this" at 9:20.'
      - The cufflink found near the study is yours.
  2:
    text: |
      You've remembered two things:

      1. **The cufflink**: you were moving furniture into the study with
         Roderick this afternoon, sleeves rolled up. Ask Roderick to confirm it.
      2. **The terrace has a security camera.** You were out there from 9:22
         until the lights came back. Demand that Roderick check the footage.

      Roderick may make you sweat first. Sweat.
    reveal:
      - You lost the cufflink helping Roderick move furniture this afternoon.
      - Ask Roderick to check the terrace camera.
  3:
    text: |
      You finally check the pockets of the coat you grabbed at 9:22, Douglas's
      coat. There's a **folded bank statement** inside (prop in this
      envelope).

      Don't read it out. When Roderick calls for final evidence, **hand it to
      him.** It's his to read.
    reveal:
      - Hand Douglas's folded bank statement (from his coat) to Roderick.

texts:
  - id: kevin-douglas-history
    from: Uncle Douglas
    trigger: { history: true }
    stamp: "9:21 PM"
    body: "Regret is a luxury, Kevin. You can't afford it either."
  - id: kevin-maya-history
    from: M ♥
    trigger: { history: true }
    stamp: "6:20 PM"
    body: "If you tell him tonight, tell him properly. I'm not a secret you keep from your uncle. (Fine, I am. But not after midnight.)"
  - id: kevin-maya-r2
    from: M ♥
    trigger: { round: 2, after: 5 }
    body: "I was at the study door at 9:36. It was a woman's voice. You were outside, I know you were. Hold your nerve."
  - id: kevin-morgan-r1
    from: Morgan
    trigger: { round: 1, after: 14 }
    body: "Breathe. Say it was about family. Nobody can prove otherwise."
  - id: kevin-terrace-r2
    from: Cameron Security (auto)
    trigger: { round: 2, after: 8 }
    body: "Motion recorded: TERRACE CAM 02, 21:22 to 21:47. Footage retained 24h."

host_notes: |
  Supporting. Kevin and Maya are a couple in real life: their storyline is
  a secret romance with each other, never with anyone else. False suspect C. The terrace camera still (late Round Two)
  clears him. In Round Three he hands Roderick the bank statement; the prop
  must be in his Round Three envelope. If Kevin isn't cast, Roderick "finds" the
  statement in Douglas's coat himself. Morgan's Round One text to Kevin
  mirrors hers ("you believe me, right?").
