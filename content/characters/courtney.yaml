id: courtney
name: Lady Courtney Fane-Whitlow
written_for: Courtney (maybe RSVP)  # HOST
tier: flex                      # HOST
pronouns: she/her               # HOST
role: Minor aristocrat (professional guest)
public_role: "An old friend of the family, or so she says"   # what everyone at the party knows; shown on every guest's guest list
tagline: "Your title is fake, your accent is fake, and you're the most convincing aristocrat in the room."

costume: |
  Aristocrat by way of a costume shop: a tiara (slightly too large), opera
  gloves, a sash with a crest you designed yourself, pearls, and a cut-glass
  accent that slips when you're drunk.

intro: |
  To the room you are **Lady Courtney Fane-Whitlow**, daughter of an Earl
  nobody can quite place. In reality you're Courtney, and you're a
  **professional guest**, paid to attend parties and make them look grander.
  Tonight's booking came through Hannah Wellington.

backstory: |
  You've been a viscount's widow, a Hungarian countess and, once, briefly,
  a minor Romanov. You're very good. Hannah pays you $500 a night to make
  the Wellington galas look like they have titled supporters, and she
  brought you along tonight as "an old family friend of the Camerons."

  You've made one mistake already. At **8:05**, while Douglas was greeting
  guests in the Front Hall, you slipped into his empty study and took a
  **selfie posing with the bronze raven** "for the grid." Then you put it
  back. You posted it. It has 214 likes. Your fingerprints are all over the
  murder weapon.

  Your real name is Courtney. The rest is invented, and you're prouder of
  the invention than most people are of their ancestors. You grew up above a
  dry cleaner's, pressing rich people's evening clothes and learning exactly
  how they were meant to hang. Fane-Whitlow came from two gravestones in a
  churchyard you liked the look of. Tonight is the best house you've ever
  worked: real portraits, a real raven, a real dead man. You keep catching
  yourself wanting to belong here, which is deeply unprofessional.

relationships:
  - with: hannah
    text: Your employer tonight. She's terrified you'll blow your cover. You're terrified she won't pay you.
  - with: lexi
    text: You've claimed you two were at school together. She keeps squinting at you.
  - with: jimmy-friedman
    text: He's been trying to do a "deal" with you all night because you have a title. Possibly lucrative.
  - with: molly
    text: You asked her whether the bird on Douglas's desk was "worth anything." She looked at you like a forgery. Rich, coming from her.
  - with: carlotta
    text: Two years ago you swept into Carley's Berlin gallery opening as a Hungarian countess, drank the champagne and bought nothing. She knows exactly what you are. She hasn't said. Yet.
  - with: morgan
    text: Morgan has hired you twice to play minor nobility at Cameron Legal client dinners. She knows exactly what you are, and she pays in cash.
  - with: roderick
    text: You've worked rooms with Roderick before. He's the only Cameron who finds your act funny, and the only one who knows your real surname.
  - with: savanah
    if: savanah
    text: The "widow." You recognize a fellow performer. You've been turning the pages for her at the piano.

evening:
  - at: "8:05 PM"
    where: study
    text: You slip into the empty study and take a selfie with the bronze raven. Then you put it back exactly where it was.
  - at: "8:10 PM"
    until: "9:00 PM"
    where: drawing-room
    text: Telling anecdotes about "Daddy's grouse moor."
  - at: "9:00 PM"
    until: "9:24 PM"
    where: drawing-room
    text: At the piano, playing badly or turning pages for whoever sings.
  - at: "9:25 PM"
    until: "9:45 PM"
    where: dining-room
    text: When the cake comes out you carry the candles in like a coronation, then stay at the front of the crowd conducting the singing with a champagne flute. The whole room saw you.

knows:
  - You handled the bronze raven at 8:05. Your fingerprints are on it. There's a photo.
  - You put it back on the desk exactly where you found it.
  - You were in full view from 9:00 until the blackout: at the piano, then conducting the singing at the birthday cake.
  - Hannah Wellington hired you. You are not a lady.

secret: |
  You're **not a lady**, you're a hired professional guest. And you **posed
  with the murder weapon at 8:05**, then posted it.

blackmail:
  - You held the bronze raven tonight and posted a photo.
  - You're not an aristocrat; you're a hired professional guest.
  - Hannah Wellington is paying you to be here.

instructions:
  - Never drop the accent unless paid, or very drunk.
  - In Round Two, your raven selfie comes out. Panic beautifully.
  - You may "recognize" any guest from "a hunt ball."
  - Your alibi (the piano, then the cake, 9:00 to 9:45) is rock solid. Use it.

mission: |
  Get **someone to invite you to their country house** (any house, any
  country). Report the invitation to Roderick.

rounds:
  1:
    text: |
      Be fabulous. Be devastated. Mention Daddy. Establish your alibi: the
      piano from 9:00, then the birthday cake until the lights went out.
    reveal:
      - You were at the drawing-room piano from 9:00, then at the birthday cake until the blackout.
  2:
    text: |
      Your post has been found. Show the room your phone ("delete nothing,
      darling, it's evidence") with **you posing with the bronze raven,
      posted at 8:05.**

      Your fingerprints are on the murder weapon. Panic. Then remember
      that Molly saw it back on the desk at 8:45, and that you were
      conducting "Happy Birthday" while Douglas died.
    reveal:
      - You posed with the bronze raven in Douglas's study at 8:05 and posted the photo.
  3:
    text: |
      If your cover is about to be blown, choose: confess you're a hired
      professional guest (dramatic, freeing), or bribe Hannah not to tell.
    reveal:
      - Either confess you're a hired guest or bribe Hannah to keep quiet.

texts:
  - id: courtney-hannah-history
    from: Hannah W.
    trigger: { history: true }
    stamp: "4:00 PM"
    body: "Tonight you're 'an old family friend of the Camerons.' Do NOT do the Romanov thing again."
  - id: courtney-instagram-r1
    from: Instagram
    trigger: { round: 1, after: 10 }
    body: "Your post 'me and the bird 🖤🐦' has 214 likes. @thekeyhole commented: 'interesting choice of accessory'"

fallback: |
  Nothing depends on Courtney. If she isn't cast, the raven-selfie red
  herring and the Molly, Hannah, Lexi and Jimmy Friedman lines about her
  (inside [[if:courtney]] blocks) disappear.

host_notes: |
  Real-life ties (Ross): Courtney knows Ross, Carley, Morgan and others. Her
  character is wired to Carley (Berlin), Morgan (hired her before) and
  Roderick (in on the act). Add more ties when Ross remembers who else.

  Flex (maybe RSVP), theatrical. Zero solution-critical clues. Red herring:
  fingerprints on the weapon, resolved by Molly (raven on the desk at 8:45) and
  her alibi (piano, then cake). Whereabouts: drawing room, then the dining room
  from 9:25, far from the study.
