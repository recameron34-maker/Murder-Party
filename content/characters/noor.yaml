id: noor
name: Dr. Noor Beaumont
written_for: Noor               # HOST
tier: core                      # HOST
pronouns: she/her               # HOST
role: Arthur's private physician
tagline: "You've seen how every body in this house ends. Tonight you were right."

costume: |
  Elegant and clinical, and comfortable: a dark flowing dress or soft
  tailoring, hair pinned back, reading glasses on a chain, and a vintage
  doctor's bag that you insist is "purely decorative." Low heels. You're
  expecting; nobody gets to make you stand all night.

intro: |
  You are Arthur's doctor, discreet and brilliant, and the only person in the
  house besides his nurse who knows how sick he was. You're married to the
  Professor, Joji Beaumont, who loves this house more than is healthy, and
  you're expecting your first child.

backstory: |
  For six years you've kept Arthur Blackwood alive with excellent medicine and
  total discretion. He had **heart failure**: months, not years. He made you
  promise to tell no one.

  The Beaumonts have Blackwood money in their bones. Arthur funds Joji's
  research on the house, and Joji's research has quietly paid your mortgage.
  When you told Arthur about the baby he insisted on being godfather and had
  Annie invent a non-alcoholic Reckoning just for you. "The Reckoning without
  the reckoning," he called it. You're going to miss him.

  You also have a slightly mortifying secret. Last spring Arthur asked you,
  with enormous dignity, for "something to put the spring back in the step."
  You prescribed it. You have since become aware that the spring was for
  Clara. You'd rather die than discuss it, which in this house is a real
  risk.

relationships:
  - with: joji
    text: Your husband, the Professor. Brilliant, distracted, in love with a building, and about to be a father. He has measured the nursery four times.
  - with: arthur
    text: Your patient of six years, your patron and a terrible patient. He never once took his pills on time.
  - with: shea
    text: Arthur's nurse. You two are the only ones who knew the truth about his heart.
  - with: clara
    text: You know far more about her and Arthur's "meetings" than you'd like to, medically speaking.

evening:
  - at: "8:00 PM"
    until: "9:15 PM"
    where: drawing-room
    text: Trapped by Kushington explaining forensic accounting. You diagnosed him with "enthusiasm" and escaped.
  - at: "9:15 PM"
    until: "9:45 PM"
    where: drawing-room
    text: By the fire with Joji and Hannah, the whole time. Joji was describing load-bearing walls. You were counting the minutes until supper.
  - at: "9:47 PM"
    where: study
    text: When the lights come back and Reggie finds Arthur, you go in with him. One blow to the head. The body is already cooling. That bothers you a great deal.

knows:
  - Arthur had severe heart failure and only months to live. Only you and Shea knew.
  - His illness did **not** kill him. One blow to the head with something heavy did.
  - From the body (temperature, the drink half-finished, the blood) he died between **9:35 and 9:40 PM**, not during the blackout.
  - You prescribed Arthur a little "vitality" medication for reasons involving Clara.

secret: |
  You've known since 9:47 that **Arthur died before the lights went out**,
  between 9:35 and 9:40. You've kept it to yourself because you wanted to be
  certain, and because a doctor saying "murder" in this house is how
  doctors get uninvited. You also prescribed Arthur's "vitality" pills.

blackmail:
  - Arthur was dying of heart failure.
  - Arthur died between 9:35 and 9:40, before the blackout.
  - You prescribed Arthur's "vitality" pills, and you know who they were for.

instructions:
  - Reveal the time of death (9:35 to 9:40) in **Round Two**, not before. If someone pays you for it in Round One, refuse.
  - Be clinical and precise. You are the one person here whose facts nobody should doubt.
  - You may examine any physical evidence Reggie produces and give a medical opinion. You never have to crawl about searching for it; send someone else.
  - Never mention the "vitality" pills unless paid.

mission: |
  Privately ask **three people when they last saw Arthur alive.** Write down
  their answers. Bring the list to Reggie.

rounds:
  1:
    text: |
      Shea is going to say something chilling about Arthur's health. When
      Reggie turns to you, confirm that Arthur had a serious heart condition,
      but that **his illness did not cause his death.** He was struck.

      This is officially murder.
    reveal:
      - Arthur's illness did not kill him. He was struck on the head.
  2:
    text: |
      Now the big one. When asked (or when the moment feels right), say it
      plainly:

      **Arthur died between 9:35 and 9:40 PM.**

      The lights went out at 9:45. He was dead *before* the blackout.
      Everyone has been investigating the wrong minute.
    reveal:
      - Arthur's time of death was between 9:35 and 9:40 PM, before the blackout.
  3:
    text: |
      One more medical detail if anyone asks: it was a **single blow**,
      struck close. No defensive wounds, no struggle. Arthur let his killer
      get near him. He wasn't afraid of whoever it was.

      Support the timeline: 9:31 alive (Annie), 9:35 to 9:40 dead (you), 9:45
      blackout.
    reveal:
      - It was a single blow from close range with no struggle; Arthur wasn't afraid of the killer.

texts:
  - id: noor-arthur-history
    from: Arthur Blackwood
    trigger: { history: true }
    stamp: "Yesterday 7:03 PM"
    body: "Not a word to anyone tomorrow. I intend to die at a time of my choosing, Doctor, and not a minute before the announcement."
  - id: noor-joji-r1
    from: Joji ❤️
    trigger: { round: 1, after: 4 }
    body: "Are you all right? You went very quiet when you came out of the study. You have your 'I already know' face on."
  - id: noor-unknown-r2
    from: Unknown number
    trigger: { round: 2, after: 3 }
    body: "Tell them what the body told you, Doctor. The dark didn't kill him."

host_notes: |
  Noor is pregnant in real life (and in character). Annie's non-alcoholic
  "Reckoning" is canon, so make sure there's a good mocktail. Keep her role
  seated and spoken; she shouldn't have to hunt for evidence.

  Core. Time of death (9:35 to 9:40) in Round Two is THE first major twist.
  Ross's rescue: "Dr. Beaumont. You've had more time to examine what
  happened. What can you tell us?"
