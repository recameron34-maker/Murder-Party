id: spare-wren
name: Wren
written_for: Spare, any late guest   # HOST
tier: flex                      # HOST
effort: high                    # HOST
pronouns: any                   # HOST
role: Heir hunter and genealogist
public_role: "Genealogist"   # what everyone at the party knows; shown on every guest's guest list
tagline: "Every great fortune has a lost heir. You find them, for thirty percent."

costume: |
  Victorian investigator: a long coat, a magnifying glass on a chain, a
  battered leather case of "documents" (photocopies, a family tree drawn on
  a scroll), and the conviction of a prophet. You're "[Name] Wren."

intro: |
  You hunt heirs. When a fortune is in doubt you find the cousin nobody knew
  about, prove the connection and take thirty percent. Tonight you've come
  to Cameron Castle with a bombshell: **you've found a secret Cameron
  heir, and they're in this room.**

backstory: |
  Your evidence: a 1990s christening record from a village church with the
  godfather listed as "D. Cameron," a photo of Douglas with Vivienne St.
  Clair, and a lot of intuition. Your conclusion: **Lexi St. Clair is
  Douglas's secret daughter**, and with the will destroyed she could claim the
  lot. You've drafted the contract for your thirty percent.

  Your secret: the christening record proves Douglas was her **godfather**.
  That's all. You've been reading it very creatively. And you need this win.
  Your last three "heirs" were frauds.

relationships:
  - with: lexi
    text: Your "lost heir." You need her to sign your contract before anyone proves you wrong.
  - with: carlotta
    text: The legitimate daughter. Your discovery would cut her inheritance in half. She is not pleased to meet you.
  - with: alma
    text: The archivist has the family Bible. You need it. She won't let you touch it without gloves.
  - with: kim
    text: The Keyhole has called you "the ambulance-chaser of Debrett's." You're hoping for a better review tonight.

evening:
  - at: "8:00 PM"
    until: "9:15 PM"
    where: drawing-room
    text: Studying Lexi's profile against Douglas's portrait. Muttering "the jawline."
  - at: "9:15 PM"
    until: "9:45 PM"
    where: dining-room
    text: Trying to persuade Alma to fetch the family Bible, then copying names off the place cards with Tim watching. When Alma leaves at 9:39 you stay, reading place cards until the lights go out.

knows:
  - Douglas was Lexi's godfather (christening record).
  - You've been presenting it as proof he was her father. It isn't.
  - You were in the dining room from 9:15 until the blackout with Tim (and Alma until 9:39).

secret: |
  Your "proof" that **Lexi is Douglas's secret heir** only proves he was her
  godfather. You're bluffing for a thirty-percent fee.

blackmail:
  - Your christening record only proves Douglas was Lexi's godfather.
  - You take thirty percent of whatever your "heirs" inherit.
  - Your last three heirs were frauds.

instructions:
  - High effort. Make the accusation loudly, with documents, in Round One.
  - Pursue Lexi all night with your contract.
  - Admit the record only says "godfather" if paid, or if Lexi proves otherwise.
  - You may "recognize the Cameron jawline" on any guest you like.

mission: |
  Get **any guest to sign your "heir-finding contract"** (a napkin will do).
  Show Roderick.

rounds:
  1:
    text: |
      Make your announcement: **there is a secret Cameron heir in this
      room.** Then turn, slowly, to Lexi.
    reveal:
      - Announce that Lexi St. Clair is Douglas's secret heir.
  2:
    text: |
      Produce your "evidence": a christening record with "D. Cameron," the
      photo with Vivienne, the jawline. Push Lexi to sign. Push Carlotta's
      buttons.
    reveal:
      - Present your christening record as proof of Lexi's parentage.
  3:
    text: |
      When Lexi produces her DNA result (or someone reads your document
      properly), fold: **"godfather" is what it says.** Gracefully, or
      not.
    reveal:
      - Admit your record only proves Douglas was Lexi's godfather.

texts:
  - id: wren-office-history
    from: Wren & Associates
    trigger: { history: true }
    stamp: "3:00 PM"
    body: "Reminder: the landlord wants October's rent. Please tell me this Cameron thing is real."
  - id: wren-unknown-r2
    from: Unknown number
    trigger: { round: 2, after: 9 }
    body: "Godfathers sign christening records. Fathers don't, usually."

fallback: |
  Nothing depends on Wren. If Wren isn't cast, the "secret daughter" rumor is
  just gossip Lexi can enjoy, and Lexi's [[if:spare-wren]] line disappears.

host_notes: |
  Spare, high effort, any gender or name. Red herring (Lexi as secret heir)
  resolved by Lexi's DNA test (Round Three). Whereabouts: drawing room, then
  dining room. Never near the study.
