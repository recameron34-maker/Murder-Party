id: spare-vesper
name: Margaux "Maggie" Pancini
written_for: Spare, any late guest   # HOST
tier: flex                      # HOST
effort: medium                  # HOST
pronouns: any                   # HOST
role: Ghostwriter of Douglas's memoir
public_role: "Ghostwriter of Douglas's memoir"   # what everyone at the party knows; shown on every guest's guest list
tagline: "You've been Douglas's voice for a year. Now you're the only one who knows how his book ends."

costume: |
  Literary noir: black on black, a fountain pen, ink-stained cuffs, a
  leather manuscript folder labeled BLACK STONE, and the look of someone who
  hasn't slept since the first draft. You write as "Vesper"; the name on
  the cover will be Douglas's.

intro: |
  For a year you've been ghostwriting Douglas's memoir, *Black Stone*. You've
  heard every secret he was willing to say out loud, and a few he whispered
  to make sure you wrote them down.

backstory: |
  Last week Douglas dictated a final chapter titled **"The Thief in My
  House."** You have the draft. It says: *"Someone I raised up has been
  robbing me. I will not name them until midnight."* He raised up a lot of
  people: a ward, a cook's granddaughter, a scholarship lawyer, a nephew.
  The line fits half the room.

  Your own sin: the juiciest chapters, about Clara, about Carlotta's mother,
  about a Las Vegas weekend, you **embellished**. Quite a lot. Douglas
  signed off on them laughing.

  You came to ghostwriting from a literary career that never quite caught:
  two novels, admired and unbought. Douglas found you through his publisher
  and hired you after one lunch, because you were the only writer who asked
  him what he was ashamed of. You've spent a year in the castle library with
  a recorder between you, learning the cadence of a man who never once had
  to raise his voice. You've started dreaming in his sentences. Some nights,
  writing alone, you forget which memories are yours.

relationships:
  - with: clara
    text: Chapter Nine is about her. She hasn't read it. She'd sue.
  - with: carlotta
    text: Chapter Two is about her mother leaving. Douglas cried dictating it. You've never told Carlotta.
  - with: malik
    text: A journalist. He's been circling you all night, trying to get the final chapter.

evening:
  - at: "8:00 PM"
    until: "9:24 PM"
    where: drawing-room
    text: At the party all night, watching your characters walk around in real life.
  - at: "9:25 PM"
    until: "9:45 PM"
    where: dining-room
    text: When the cake comes out you follow the crowd into the Dining Room and take notes on who stands next to whom. Never out of sight.

knows:
  - 'Douglas''s last dictated chapter: "Someone I raised up has been robbing me. I will not name them until midnight."'
  - You embellished several chapters about real people.
  - Douglas cried dictating the chapter about Carlotta's mother.

secret: |
  You hold Douglas's unpublished last chapter, **"The Thief in My House,"**
  and you've **embellished** the memoir's most scandalous chapters.

blackmail:
  - You have Douglas's final chapter, "The Thief in My House."
  - You embellished the chapters about Clara and the Vegas weekend.
  - Douglas cried about Carlotta's mother.

instructions:
  - You may read short "excerpts" from *Black Stone* at dramatic moments. Invent freely; they're memoir, not evidence.
  - The "Thief in My House" quote is real. Reveal it in Round Two.
  - Never admit the embellishments unless paid.
  - Your alibi: the crowd all night, the drawing room and then the birthday cake.

mission: |
  Get someone to give you **a quote for the final chapter**, something
  dramatic about Douglas, on the record. Report it to Roderick.

rounds:
  1:
    text: |
      Reveal that you were writing Douglas's memoir. Be coy about how it
      ends.
    reveal:
      - You were ghostwriting Douglas's memoir, Black Stone.
  2:
    text: |
      Read the line from Douglas's final chapter: **"Someone I raised up has
      been robbing me. I will not name them until midnight."**

      Then let the room count the people Douglas "raised up."
    reveal:
      - 'Douglas''s final chapter: "Someone I raised up has been robbing me."'
  3:
    text: |
      If Carlotta seems shattered, tell her about Chapter Two. Douglas cried.
      He loved her. That's not evidence; it's just true.
    reveal:
      - Tell Carlotta that Douglas cried dictating the chapter about her mother.

texts:
  - id: vesper-douglas-history
    from: Douglas Cameron
    trigger: { history: true }
    stamp: "Last week"
    body: "Final chapter stays in the drawer until midnight Saturday. Then publish and be damned, as they say. Usually about me."

fallback: |
  Played by Maggie Pancini (October 2026), so the character is Margaux
  "Maggie" Pancini, ghostwriting as "Vesper". Nothing depends on Vesper. The "raised up" line corroborates the theft
  being an inside job without pointing to one person.

host_notes: |
  Spare, medium effort, any gender or name. Corroborating flavor only; the
  "raised up" line fits James, Maya, Morgan and Kevin equally. Whereabouts:
  drawing room, then the dining room for the cake.
