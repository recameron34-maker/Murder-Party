id: jimmy
name: James "Jimmy" Calloway
written_for: Jimmy (not Jimmy Friedman)   # HOST
tier: core                      # HOST
pronouns: he/him                # HOST
role: Douglas's ward, recently cut from the will
public_role: "Douglas's ward, raised at Cameron Castle"   # what everyone at the party knows; shown on every guest's guest list
tagline: "Raised in the house, never of it. As of last month, not even in the will."

costume: |
  Old-money dishevelment: a slightly too-good dinner jacket worn carelessly,
  loosened bow tie, signet ring, a cigarette (real or prop) you keep not
  lighting. Look like someone who was born rich by accident and is about to
  be poor on purpose.

intro: |
  You're the cuckoo in the Cameron nest. Douglas took you in at nine when
  your father, his partner Teddy Calloway, died. You grew up in this house,
  in the will, in the family photographs. Then last month Douglas cut you out.

backstory: |
  You've spent your life performing gratitude. Boarding school, the good
  university, the summers at the castle. You were the Cameron boy without
  the Cameron name, and you were always going to be "taken care of."

  Then you did something stupid. You borrowed **$300,000 from Jimmy
  Friedman** against your expected inheritance. Douglas found out and called
  you into the study: *"I will not have my estate used as collateral by
  sharks."* You were out of the will by Monday.

  At least there's Alma. Nobody knows about you and Alma.

relationships:
  - with: douglas
    text: Guardian, benefactor, judge. You loved him and you're furious with him and now he's dead.
  - with: jimmy-friedman
    text: The other Jimmy. You owe him $300,000 that you no longer have any way to repay. He's been smiling at you all night.
  - with: alma
    text: Your secret. The archivist. Two outsiders in a house that never let either of you all the way in.
  - with: carlotta
    text: Practically a sister. She left; you stayed. She got the name; you got the bills.
  - with: savanah
    if: savanah
    text: Douglas's 2019 Las Vegas bride. You were his minder that weekend and his best man at 3 a.m. in a borrowed bow tie. You also know about the annulment two weeks later. She's been texting you all week.
  - with: kevin
    text: Fellow disappointed heir. You'd love three people to agree he had the bigger motive.

evening:
  - at: "8:50 PM"
    until: "8:58 PM"
    where: study
    text: You confront Douglas about the will. He doesn't raise his voice. He says, "Tonight isn't about you, James." It's worse than shouting.
  - at: "9:00 PM"
    until: "9:38 PM"
    where: billiard-room
    text: Losing at cards to Jimmy Friedman, which feels on-brand. Daniel and Martin are playing too.
  - at: "9:38 PM"
    where: front-hall
    text: You leave the game to call your lawyer about contesting the will. The only phone signal in the house is at the mouth of the Library Corridor.
  - at: "9:40 PM"
    where: library-corridor
    text: On the phone, pacing, you see **Morgan** inside the library, near the doorway, smoothing her dress. Odd place for the family lawyer. You turn away to finish your call.
  - at: "9:41 PM"
    until: "9:47 PM"
    where: front-hall
    text: Still arguing with your lawyer's voicemail when the lights go out.

knows:
  - Douglas cut you out of the will last month because you borrowed against your inheritance from Jimmy Friedman.
  - At about **9:40** you saw Morgan in the library, near the corridor.
  - Douglas told you at 8:50, "Tonight isn't about you." You didn't know what he meant.
  - Kevin also had a terrible argument with Douglas tonight.

secret: |
  You saw **Morgan near the library at 9:40**, you owe Jimmy Friedman
  $300,000, and you've been sleeping with Alma, the archivist.

blackmail:
  - You were removed from Douglas's will last month.
  - You saw Morgan in the library at about 9:40.
  - You owe Jimmy Friedman $300,000.

instructions:
  - Admit early that you were cut from the will. Everyone will find out anyway.
  - Reveal the Morgan sighting in **Round Two**. If Roderick asks "James, didn't you say you walked through that hallway?", that's your cue.
  - Deflect onto Kevin whenever you can.
  - Never confirm the affair with Alma unless paid.

mission: |
  Get **three people to agree that Kevin had the strongest inheritance
  motive.** Report the three names to Roderick.

rounds:
  1:
    text: |
      Admit it before someone else does: **Douglas removed you from his will.**
      You confronted him about it at 8:50. Yes, you were angry. No, you didn't
      kill him. You were losing at cards from 9:00.

      Then pivot hard to Kevin. *Kevin* expected the whole house.
    reveal:
      - Douglas removed you from his will, and you confronted him at 8:50.
  2:
    text: |
      Now say it: **around 9:40 you left the card game to make a phone call
      by the Library Corridor, and you saw Morgan in the library.**

      You thought nothing of it then. You're thinking about it now.
    reveal:
      - You saw Morgan near/in the library at about 9:40.
  3:
    text: |
      Someone will ask why Douglas cut you out. Tell the truth, with as much
      dignity as you can manage: you borrowed **$300,000 from Jimmy
      Friedman** against your inheritance, and Douglas would not have his
      estate "used as collateral by sharks."

      It's humiliating. It isn't murder.

      [[if:savanah]]
      And if Savanah is still calling herself the widow, you were best man at
      that wedding, and you were there when Roderick and the lawyers flew out
      two weeks later with the annulment. Say so, kindly.
      [[/if]]
    reveal:
      - Douglas cut you out because you borrowed $300,000 against your inheritance from Jimmy Friedman.

texts:
  - id: jimmy-friedman-history
    from: Jimmy Friedman
    trigger: { history: true }
    stamp: "4:15 PM"
    body: "Looking forward to tonight, kid. Big night for your 'expectations.' 😉"
  - id: jimmy-lawyer-r1
    from: Lawyer (voicemail)
    trigger: { round: 1, after: 9 }
    body: "Mr Calloway, I've got your three messages from 9:40-ish. Please stop calling me from what sounds like a crypt."
  - id: jimmy-alma-r2
    from: A.
    trigger: { round: 2, after: 6 }
    body: "You saw her too, didn't you. By the library. Don't make me say it alone."

host_notes: |
  Core. The Morgan library sighting at 9:40 (Round Two) is solution-critical.
  The "why was James cut from the will" scandal resolves in Round Three. Don't
  confuse him with Jimmy Friedman; Roderick calls this one "James."
