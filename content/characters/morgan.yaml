    trigger: { history: true }
    stamp: "Friday 11:52 PM"
    body: "Bring the Wellington papers tomorrow. And your conscience, if it isn't too much trouble. — A."
  - id: morgan-arthur-929
    from: Arthur Blackwood
    trigger: { history: true }
    stamp: "9:29 PM"
    body: "My study. 9:35. We settle this tonight."
  - id: morgan-unknown-r3
    from: Unknown number
    trigger: { cue: "Right after Annie says she passed Morgan in the corridor (Round Three)" }
    body: "Every Blackwood secret comes home to roost."

host_notes: |
  The killer. Her page is deliberately the same shape and length as
  everyone else's (the tests enforce it). Optional prop: a folded
  "CONFIDENTIAL LEGAL" page for a final "empty your pockets" moment. Her
  Round Two envelope must physically contain the email prop.
