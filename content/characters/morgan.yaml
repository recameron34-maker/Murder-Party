# Fields marked HOST are never rendered on guest pages.
id: morgan
name: Morgan Leibold
written_for: Morgan            # HOST
tier: core                     # HOST
pronouns: she/her              # HOST
role: Arthur's attorney, Blackwood Legal Counsel
public_role: "Arthur's attorney, Blackwood Legal Counsel"   # what everyone at the party knows; shown on every guest's guest list
tagline: "Everybody's secrets cross your desk eventually. You file them alphabetically."

costume: |
  Sharp and expensive: a tailored black suit or severe column dress, pearls,
  a good watch, and a leather document folio you never put down. Look like you
  bill for breathing.

intro: |
  You are the Blackwoods' lawyer: you draft the wills, bury the scandals, and
  know where every body in this family is buried, figuratively. Arthur trusts
  you with everything. Tonight that is a problem.

backstory: |
  Arthur met you at nineteen, a mill-town girl waiting tables at one of his
  dinners, and paid for law school "because you looked at the silver like you
  were pricing it." Now you have a townhouse, a horse named Precedent, and a
  wardrobe, none of it quite paid for.

  Fourteen months ago a property gamble collapsed under you. You "borrowed"
  **$2.4 million** from Blackwood Holdings in six transfers, authorized
  through your own firm and parked in a shell company you named **Corvid
  Holdings** because you thought it was funny. You always meant to pay it
  back.

  All week Arthur asked you helpful questions about "odd transfers." You
  were very helpful.

relationships:
  - with: arthur
    text: Your patron, your client, your maker. You'd have said you loved him.
  - with: kevin
    text: You handle his allowance. He signs whatever you hand him. Useful.
  - with: annie
    text: You handled her divorce for free. She has been fiercely loyal ever since.
  - with: lindsey
    text: Arthur's banker. Far too interested in transfer patterns.
  - with: joji
    text: Your office filed his landmark application. You've read his survey, including the 1891 plans.
  - with: savanah
    if: savanah
    text: You carried her 2019 annulment papers. Let her play the widow.

evening:
  - at: "8:00 PM"
    until: "9:24 PM"
    where: drawing-room
    text: Charming everyone.
  - at: "9:25 PM"
    until: "9:31 PM"
    where: dining-room
    text: 'You follow the birthday cake into the Dining Room with everyone else. At 9:29 Arthur texts: **"My study. 9:35. We settle this tonight."**'
  - at: "9:32 PM"
    where: east-corridor
    text: You pass Annie coming back from the study with an empty tray. You smile. She smiles.
  - at: "9:34 PM"
    until: "9:38 PM"
    where: study
    text: '"If the money isn''t back by midnight, I''m going public." You say, "You''ll destroy me." He turns away. The raven is right there. You strike once.'
  - at: "9:39 PM"
    until: "9:41 PM"
    where: library
    text: With his red folder, through the panel by the fireplace and Silas's passage into the library. You keep the **CONFIDENTIAL LEGAL** page and hide the folder behind the books.
  - at: "9:41 PM"
    where: library-corridor
    text: 'You nearly walk into Alma. "Looking for the restroom," you say. She walks you there herself.'
  - at: "9:42 PM"
    until: "9:47 PM"
    where: dining-room
    text: Back at the cake with a glass in your hand before the lights go out. When they return you look as shocked as anyone.

knows:
  - Arthur is dead because of you. Nobody else knows.
  - The 9:45 blackout had nothing to do with you. It was a gift.
  - The study passage comes out behind a library bookcase.
  - 'Cover story: you knocked at 9:35, got no answer, and went looking for the powder room.'

secret: |
  **You killed Arthur Blackwood** at about 9:38 with the bronze raven to stop
  him exposing the $2.4 million you stole. You escaped through the hidden
  passage into the library, and the torn-out legal page is still on you.

blackmail:
  - You had a 9:35 meeting with Arthur tonight.
  - Blackwood Legal Counsel authorized the six transfers.
  - You were in the library just before the lights went out.

instructions:
  - "**You may accept Blackmail Cash and lie.**"
  - Never confess. Make them prove motive, means, opportunity, escape and timeline.
  - You may say your 9:35 knock went unanswered.
  - Steer suspicion toward Lindsey, Molly, Kevin or Carlotta.

mission: |
  Get at least **two people to publicly accuse someone other than you**.
  Tell Reggie when you've done it.

rounds:
  1:
    text: |
      Be helpful. Be appalled. Remind people of Kevin's threat, Molly's fake
      and Carlotta's inheritance.

      At the end of the round Reggie will read Arthur's last text, sent to
      you. Stay calm: a **scheduled meeting**, legal work.
    reveal:
      - When Arthur's phone is read out, admit the 9:35 meeting was real and was about "legal work."
  2:
    text: |
      If the calendar shows **9:35 M.L.**, admit it's you. Then play your best
      card: read aloud Arthur's email (prop in this envelope):

      > *Morgan, I need you to review the Wellington, Monroe and Vale matters
      > before midnight. There are too many loose ends. — Arthur*

      *"I am literally his lawyer. Half the suspicious things you've found
      involve me because Arthur paid me to deal with suspicious things."*
    reveal:
      - Read Arthur's email aloud (prop in this envelope).
  3:
    text: |
      They'll come for you: Annie in the corridor, **BLACKWOOD LEGAL COUNSEL**,
      **ML-0427**, and **LEGAL. $2.4M. MIDNIGHT.** in Arthur's hand.

      *"Of course my office appears on his notes. I'm his attorney. I've spent
      the last week investigating this with him."* Partially true, which is
      the best kind of lie.

      When Reggie asks who *you* believe did it, accuse someone.
    reveal:
      - When ML-0427 comes out, admit it is a Blackwood Legal Counsel login (but "half the office uses it").

