id: jimmy-friedman
name: Jimmy Friedman
written_for: Jimmy Friedman     # HOST
tier: supporting                # HOST
pronouns: he/him                # HOST
role: Dealmaker, lender, aspiring member of the old-money set
public_role: "Investor; runs the card game in the billiard room"   # what everyone at the party knows; shown on every guest's guest list
tagline: "You don't lend money. You invest in other people's futures. At twenty percent."

costume: |
  New money trying very hard: a velvet tuxedo jacket in a color God never
  intended, a pinky ring, a cigar (unlit), slicked hair, a wad of Blackmail
  Cash you flash at every opportunity.

intro: |
  You made your money fast and nobody here lets you forget it. You run the
  card game in the billiard room, you know everybody's debts, and you've
  spent five years trying to buy your way into rooms like this one.

backstory: |
  Your specialty is lending heirs money against what they're *going* to
  inherit. Your best investment was **James Calloway: $300,000** against his
  Cameron expectations. Then Douglas cut James out of the will, and your
  "investment" became a very expensive IOU.

  Douglas dying doesn't help you. You needed him alive and James back in the
  will. You are, if anything, the one man here who's poorer tonight. That
  hasn't stopped people looking at you.

  Romantically, you're laying siege to **Lexi St. Clair**: flowers every
  Friday, two dozen at a time. You order two bouquets each week, and nobody
  knows who the second one is for. (Your mother. You would rather be
  arrested for murder than admit it.)

  Your grandfather sold coal to Silas Cameron and was never once invited
  past the kitchens. You've been through the front door a dozen times now
  and you still count the forks. New money is a costume you wear
  beautifully: the velvet jacket, the watch, the laugh. Underneath it you're
  the boy from the market stall who learned that everyone, sooner or later,
  needs a loan they'd rather their family never heard about. The Camerons
  taught you that. There's a photograph of the castle on your office wall,
  and you've never decided whether it's a trophy or a threat.

relationships:
  - with: jimmy
    text: The other Jimmy. Owes you $300,000. You've been very warm to him all night. Warm like a hand on a throat.
  - with: maya
    text: The cook's granddaughter with a birthday. She has never once let you buy her a drink, which you find deeply unsettling.
  - with: lexi
    text: The St. Clair girl. Old name, old money, new flowers from you every Friday.
  - with: kevin
    text: Another heir. You've offered him a loan twice. He keeps almost saying yes.
  - with: courtney
    if: courtney
    text: A real live aristocrat! You've been trying to do a deal with "Lady Courtney" all night.

evening:
  - at: "8:00 PM"
    until: "9:00 PM"
    where: drawing-room
    text: Shaking hands, remembering names, and finding reasons to stand near Lexi St. Clair.
  - at: "9:00 PM"
    until: "9:45 PM"
    where: billiard-room
    text: Running the card game with Daniel, Martin and James. James left at about 9:38 to make a phone call. Daniel and Martin never left the table.
  - at: "9:45 PM"
    where: billiard-room
    text: Lights out. Somebody grabbed the pot in the dark. You suspect Martin.

knows:
  - James Calloway owes you $300,000, which is why Douglas cut him out.
  - Daniel and Martin were at your card table from 9:00 until the blackout. James left around 9:38.
  - Kevin is desperate for money. You can smell it.
  - You've been courting Lexi for months. The second bouquet goes to your mother.

secret: |
  You lent **James Calloway $300,000** against his inheritance, the reason
  Douglas cut him out. And the mysterious **second bouquet** you order every
  Friday goes to your mother.

blackmail:
  - James owes you $300,000 against his expected inheritance.
  - You've been sending flowers to Lexi St. Clair every Friday.
  - The second bouquet is for your mother.

instructions:
  - You may offer "loans" of Blackmail Cash at outrageous interest. Keep a written tally.
  - You can vouch for Daniel and Martin (card table, 9:00 to 9:45) and for James until about 9:38.
  - Deny the second bouquet until it's impossible. Then own it, with feeling.
  - Talk about money constantly. It's the only language you're fluent in.

mission: |
  Make a **"business deal" with another guest** that trades information for
  information. Get it in writing on a napkin. Report the deal to Roderick.

rounds:
  1:
    text: |
      Establish yourself as the man who knows everyone's price. Offer loans.
      Mention, casually, that you were running cards in the billiard room
      from 9:00 with Daniel, Martin and James.

      When someone asks about James and the will, smile and say it was
      "a private business matter."
    reveal:
      - You ran the card game in the billiard room from 9:00 with Daniel, Martin and James.
  2:
    text: |
      People will want alibis. Give them: **Daniel and Martin never left your
      table** until the blackout. **James left around 9:38** to make a call.

      [[if:spare-blake]]
      Blake was leaning on the billiard table watching the game the whole
      time too. Vouch for Blake if anyone asks.
      [[/if]]

      If anyone asks who the second bouquet is for, improvise. Badly.
    reveal:
      - Daniel and Martin never left the table; James left around 9:38.
  3:
    text: |
      Confirm, if asked, that **James owes you $300,000** against his
      inheritance, and that Douglas's death means you'll never see it. You
      needed Douglas alive more than anyone here.
    reveal:
      - James owes you $300,000; Douglas's death ruined you, so you had no motive.

texts:
  - id: jimmyf-james-history
    from: James C.
    trigger: { history: true }
    stamp: "4:22 PM"
    body: "Please stop sending winking faces about my 'expectations.'"
  - id: jimmyf-florist-r1
    from: Petal & Thorn Florists
    trigger: { round: 1, after: 2 }
    body: "Reminder: your standing order renews Friday. Bouquet 1: Ms L. St. Clair. Bouquet 2: Mrs R. Friedman ('To the best mum in the world'). Same cards as always?"
  - id: jimmyf-unknown-r2
    from: Unknown number
    trigger: { round: 2, after: 11 }
    body: "Interest is accruing, Mr Friedman. Not just on your loans."

host_notes: |
  Supporting. Gives alibis for Daniel, Martin and James. A distinct character
  from James "Jimmy" Calloway (Ross confirmed two guests).
