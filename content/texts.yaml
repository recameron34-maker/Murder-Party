# Phone texts sent to EVERY cast guest. Same trigger syntax as character texts:
#   { history: true } | { round: N, after: M } | { cue: "..." } | { day: D, time: "HH:MM" }
# day/time is relative to party.date in the party's time zone (day: -1 = the day before).
texts:
  - id: all-invite
    from: Cameron Castle
    trigger: { day: -1, time: "18:00" }
    body: "Your presence is requested at the Midnight Supper tomorrow. Dress for a reckoning. No one leaves before midnight."
  - id: all-road
    from: Cameron Castle
    trigger: { round: 1, after: 1 }
    body: "NOTICE: The lower road has washed out in the storm. Police delayed. The house regrets that no one may leave before midnight."
  - id: all-welcome
    from: Cameron Castle
    trigger: { history: true }
    stamp: "Tonight"
    body: "Welcome. Sign the book in the Front Hall. The house remembers everyone who signs it."
  - id: all-eastwing
    from: Cameron Castle
    trigger: { round: 1, after: 25 }
    body: "A guest has been seen in the east wing. There are no guests in the east wing."
  - id: all-portrait
    from: Cameron Castle
    trigger: { round: 2, after: 9 }
    body: "Lady Evangeline's portrait has been straightened. Nobody admits to straightening it."
  - id: all-chair
    from: Cameron Castle
    trigger: { round: 3, after: 12 }
    body: "The empty chair at the Supper has been given a fresh glass. Someone poured it."
  - id: all-raven
    from: Unknown number
    trigger: { round: 2, after: 20 }
    body: "The raven saw everything. The raven always does."
  - id: all-final
    from: Roderick
    trigger: { round: 3, after: 0 }
    body: "Final round. Trust nothing that was said in the dark."
