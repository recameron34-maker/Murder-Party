# How each character's portrait is drawn: a silhouette cameo in a gilt oval,
# like the portraits in the gallery. Silhouettes on purpose: nothing about
# the real players' looks is assumed. Details come from each costume.
#
# PUBLIC-SAFE: portraits appear on name badges, so the emblem must fit the
# character's public_role, never their secret (Hollis gets a picture frame,
# not a magnifying glass). The checker refuses telling emblems.
#
#   hair     none | bun | long | curls | slick | veil | cap | beret | short
#   extras   glasses, sunglasses, pearls, necklace, bowtie, rose, stole,
#            scarf, collar, cravat, sash, tiara, headlamp, lapels, rollneck
#   emblem   the medallion under the portrait (see the list in the checker)

