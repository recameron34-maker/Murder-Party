  theft_total: 2400000
  transfers: [300000, 450000, 275000, 600000, 375000, 400000]
  period: "Fourteen months"
  authorized_by: "Blackwood Legal Counsel (BLC), user ID ML-0427"
  destination: "Corvid Holdings Ltd, a shell company Morgan set up. Corvid means the crow family. She thought that was funny."
  how_found: >
    Lindsey Vale (Arthur's private banker) flagged the transfer pattern six
    weeks ago and told Arthur quietly. Arthur hired Kushington to trace it.
    Kush traced the authorizations to BLC two days ago and the user ID this
    week. Arthur spent the week asking Morgan "helpful" questions about the
    account, giving her the chance to come clean. She didn't.
