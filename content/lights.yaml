# HOST ONLY. The lighting plan for Ross's smart bulbs (Alexa).
#
# Make one Alexa group per room (names below), then one Alexa routine per
# scene. Fire routines from the Alexa app (Routines → ▶) rather than by voice,
# so the guests don't hear "Alexa, blackout" before it happens.
# Run-of-show segments name their scene in frontmatter (`lights: blackout`);
# the host dashboard and the run of show show it at the right moment.

groups:
  - { name: "Drawing Room", room: living-room }
  - { name: "East Corridor", room: family-room }
  - { name: "Study", room: room }
  - { name: "Library", room: landing }
  - { name: "Dining Room", room: dining-area }
  - { name: "Conservatory", room: bedroom }
  - { name: "Kitchens", room: kitchen }
  - { name: "Gallery", room: hall }

safety: >
  Leave the front stairs, the bathroom and the back stairs on ordinary
  switches, out of every routine, so nobody is ever on a staircase in the
  dark. Keep one phone torch handy for yourself during the blackout.

scenes:
  - id: arrival
    routine: "Blackwood arrival"
    when: Before the first guest rings
    look: Candlelight. Every game room warm white (about 2200K) at 40%. The study OFF, its doorway roped. Dining Room 30% with real candles on the table.
    sound: Low string-quartet covers of pop songs. Rain on the windows if you have a speaker spare.
  - id: toast
    routine: "Blackwood toast"
    when: Birthday toast
    look: Drawing Room up to 60% so everyone can see the birthday girls. Everything else stays at 40%.
    sound: Music down for the toast, back up after.
  - id: mingle
    routine: "Blackwood storm"
    when: Pre-murder mingle
    look: Drawing Room 45%, everything else 30%. Library a single dim bulb (15%), like a reading lamp left on.
    sound: Add a distant thunder track under the music. The storm is building.
  - id: blackout
    routine: "Blackwood blackout"
    when: The blackout (your cue in the run of show)
    look: >
      Dining Room OFF, wait 1 second, Kitchens OFF, wait 1 second, every
      group OFF. Thunder. Wait 15 seconds (drop a pan in the kitchen now).
      Then every group back to 25%, and the Study a deep red at 20%.
    sound: A thunder sound from Alexa's sound library (or a storm track), loud, as the last group dies.
    steps:
      - Dining Room → power off
      - Wait 1 second
      - Kitchens → power off
      - Wait 1 second
      - All Blackwood groups → power off
      - Play a thunder sound
      - Wait 15 seconds
      - All groups → 25%, warm white
      - Study → 20%, deep red
  - id: investigation
    routine: "Blackwood investigation"
    when: Round One
    look: Bright enough to read envelopes and phones. Game rooms 50% warm. Study 35% red-amber. Library 25%.
    sound: Music back, a little quieter. The storm keeps going underneath.
  - id: flicker
    routine: "Blackwood flicker"
    when: The moment the passage is mentioned (Round Two, Tim asks Joji)
    look: Every group dips to 5% for one second, then back to where it was. Do it once. Nobody will forget it.
    sound: One crack of thunder.
    steps:
      - All groups → 5%
      - Wait 1 second
      - All groups → 45%
      - Play a thunder sound
  - id: round-two
    routine: "Blackwood deeper"
    when: Round Two
    look: Everything down to 40%. The Gallery at 60% so the portraits can watch.
    sound: Darker playlist. Fewer pop covers, more strings.
  - id: round-three
    routine: "Blackwood midnight"
    when: Round Three
    look: Everything 30%, the Dining Room on candles only. Midnight is coming and the house knows it.
    sound: A ticking clock under the music if you can find one.
  - id: accusations
    routine: "Blackwood accusation"
    when: Accusations
    look: Everything 15%. Drawing Room 40%, a pool of light around you.
    sound: Music off. Just the storm.
  - id: reveal
    routine: "Blackwood reveal"
    when: The final reveal
    look: >
      Everything off except the Study, white at 70%, when you say "Study."
      When you open the hidden door, fire "Blackwood passage": Library and
      Study both up to 100%, so the room can see straight through.
    sound: Silence. Let the thunder sound once when you open the door.
  - id: passage
    routine: "Blackwood passage"
    when: You slide the bookshelf aside at the reveal
    look: Library and Study 100% warm white. Everything else stays dim.
    sound: One crack of thunder.
  - id: afterparty
    routine: "Blackwood afterparty"
    when: Awards, the midnight photograph, and after
    look: Everything 70% warm. Colour bulbs can go gold and deep green.
    sound: '"Murder on the Dancefloor", obviously. Then whatever you like.'
