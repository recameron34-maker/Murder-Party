id: library-map
title: The old floor plan
kind: prop
source: part-two
round: 2
timing: early
carrier: joji
delivery: Roderick gives it to Joji at the start of Round Two (or put it in Joji's Round Two envelope).
hide: Joji's Round Two envelope.
print: |
  CAMERON CASTLE — GROUND FLOOR — S. CAMERON, 1891

  [old-looking plan; mark STUDY and LIBRARY on either side of one wall,
  with a faint dotted line between them. Do NOT label it "secret passage".]

  [small, faded, slightly crooked office stamp in a bottom corner, easy to miss:]
  RECEIVED · B.L.C. · 14 AUG
truth: >
  The faint line is the Raven's Walk passage, study to library. The stamp is
  Cameron Legal Counsel's filing stamp from the landmark application, a
  disguised hint that Morgan's office had the plans and could know about the
  passage. Never point it out; let a sharp guest notice that "B.L.C." matches
  the ledger's "AUTHORIZED: CLC".
